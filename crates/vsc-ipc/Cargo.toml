[package]
name = "vsc-ipc"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
getrandom = "0.2"
interprocess = "2.4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
thiserror = "2.0"

[target.'cfg(windows)'.dependencies]
widestring = "1.2"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Security",
] }
[dev-dependencies]
tempfile = "3"
