[package]
name = "ai"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
git-core = { path = "../git-core" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1.43", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
regex = "1.11"
globset = "0.4"
async-trait = "0.1"
tracing = "0.1"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
