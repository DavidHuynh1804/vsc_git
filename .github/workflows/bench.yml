name: Benchmark

on:
  workflow_dispatch:
    inputs:
      size:
        description: 'Benchmark size (small, large, all)'
        required: true
        default: 'all'

jobs:
  benchmark:
    name: Git Performance Benchmark
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Benchmark
        run: node scripts/bench/run-bench.mjs --size ${{ github.event.inputs.size }}
