[package]
name = "vsc_git"
version = "0.1.0"
description = "Fast, lightweight Git GUI inspired by VS Code"
authors = ["vsc_git team"]
edition = "2021"
default-run = "vsc_git"

[lib]
name = "vsc_git_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vsc_git"
path = "src/main.rs"
test = false
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-updater = "=2.13.2"
rustls-native-certs = "=0.8.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "javascript", "typescript"] }
notify = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
git-core = { path = "../crates/git-core" }
git-read = { path = "../crates/git-read" }
git-graph = { path = "../crates/git-graph" }
vsc-ipc = { path = "../crates/vsc-ipc" }
tokio = { version = "1", features = ["full"] }
trash = "5.2"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
tempfile = "3"
hosting = { path = "../crates/hosting" }
ai = { path = "../crates/ai" }
keyring = "=4.2.0"
tokio-util = "=0.7.19"
futures-util = "0.3"

[dev-dependencies]
tauri = { version = "=2.12.3", features = ["test"] }
wiremock = "0.6.5"
